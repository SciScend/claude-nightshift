[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-nightshift"
dynamic = ["version"]
description = "Run Claude Code tasks autonomously across 5-hour usage limits, on a weekly budget you control."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Iva Popova", email = "iva.e.popova@gmail.com" }]
keywords = [
    "claude",
    "claude-code",
    "anthropic",
    "automation",
    "rate-limit",
    "agents",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/SciScend/claude-nightshift"
Documentation = "https://github.com/SciScend/claude-nightshift/blob/main/docs/nightshift-guide.md"
Source = "https://github.com/SciScend/claude-nightshift"
Issues = "https://github.com/SciScend/claude-nightshift/issues"
Changelog = "https://github.com/SciScend/claude-nightshift/blob/main/CHANGELOG.md"

[project.scripts]
claude-nightshift = "claude_nightshift.cli:run_cli"

[tool.hatch.version]
path = "src/claude_nightshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_nightshift"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["claude_nightshift"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 92
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # f-strings in logging calls are deliberate: the messages are user-facing
    # and always formatted.
    "G004",
    # Long argparse help strings read better than wrapped ones.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
